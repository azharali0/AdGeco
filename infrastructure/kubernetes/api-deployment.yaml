apiVersion: apps/v1
kind: Deployment
metadata: { name: adgeco-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: adgeco-api } }
  template:
    metadata: { labels: { app: adgeco-api } }
    spec:
      containers:
        - name: api
          image: adgeco/api:latest
          ports: [{ containerPort: 4000 }]
          readinessProbe: { httpGet: { path: /health/ready, port: 4000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 4000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
