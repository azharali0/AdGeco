apiVersion: apps/v1
kind: Deployment
metadata: {name: exchange-service, namespace: adgeco}
spec:
  replicas: 2
  selector: {matchLabels: {app: exchange-service}}
  template:
    metadata: {labels: {app: exchange-service}}
    spec:
      serviceAccountName: adgeco-runtime
      containers:
        - name: exchange-service
          image: ghcr.io/adgeco/exchange-service:${IMAGE_TAG}
          ports: [{containerPort: 3010}]
          envFrom: [{secretRef: {name: adgeco-runtime}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: exchange, namespace: adgeco}
spec: {selector: {app: exchange-service}, ports: [{port: 3010, targetPort: 3010}]}
---
