apiVersion: batch/v1
kind: Job
metadata:
  name: adgeco-database-migrate
  namespace: adgeco
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app: database-migrate}}
    spec:
      restartPolicy: Never
      serviceAccountName: adgeco-runtime
      containers:
        - name: migrate
          image: ghcr.io/adgeco/api:${IMAGE_TAG}
          command: ["pnpm","--filter","@adgeco/database","prisma:migrate:deploy"]
          envFrom: [{secretRef: {name: adgeco-runtime}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: adgeco}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      serviceAccountName: adgeco-runtime
      containers:
        - name: web
          image: ghcr.io/adgeco/web:${IMAGE_TAG}
          ports: [{containerPort: 3000}]
          env:
            - {name: NEXT_PUBLIC_API_URL, value: "https://api.example.com"}
          readinessProbe: {httpGet: {path: /login, port: 3000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 3000}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: adgeco}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 3000}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adgeco-public
  namespace: adgeco
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.example.com","api.example.com"]
      secretName: adgeco-public-tls
  rules:
    - host: app.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    - host: api.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: worker, namespace: adgeco}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: exchange-service, namespace: adgeco}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: exchange-service}
  minReplicas: 2
  maxReplicas: 50
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Percent, value: 25, periodSeconds: 60}]}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: adgeco}
spec: {minAvailable: 1, selector: {matchLabels: {app: web}}}
