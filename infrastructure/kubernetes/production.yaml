apiVersion: v1
kind: Namespace
metadata: {name: adgeco}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: adgeco}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/adgeco/api:${IMAGE_TAG}
          ports: [{containerPort: 3001}]
          envFrom: [{secretRef: {name: adgeco-runtime}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 3001}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 3001}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: adgeco}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/adgeco/worker:${IMAGE_TAG}
          envFrom: [{secretRef: {name: adgeco-runtime}}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: adgeco}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: 3001}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: adgeco}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 3
  maxReplicas: 30
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: adgeco}
spec: {minAvailable: 2, selector: {matchLabels: {app: api}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: adgeco}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
